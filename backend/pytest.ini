[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
; Fixtures and tests must share one event loop — asyncpg connections are bound to
; the loop that created them, so a session-scoped engine used from function-scoped
; test loops raises "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
